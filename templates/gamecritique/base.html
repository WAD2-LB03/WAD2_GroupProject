<!DOCTYPE html>

<html>
    <head lang="en">
        <meta charset="UTF-8" />
        <!--<link rel="stylesheet" type="text/css" href="../../stylesheets/style.css" />-->
        <style>
            .navbar {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 10%;

                align-items: center;
                display: flex;

                color: #14A35B;
                background-color: #01361B;
            }
            .nav-left, .nav-center, .nav-right {
                flex: 1;
                padding: 0 20px;
            }
            .nav-left {
                text-align: left;
            }
            .nav-center {
                text-align: center;
            }
            .nav-right {
                text-align: right;
            }

            a.navlink {
                font-size: 200%;
                color: #14A35B;
            }
            a.navlink:hover {
                font-size: 250%;
            }
            a.navlink:active {
                color: #33B6BB;
            }

            .logo {
                font-size: 300%;
                text-decoration: none;
                font-weight: bold;
            }

            .logo-game {
                color: #33B6BB

            }
            .logo-crit {
                color: #14A35B;

            }
            .logo-ique {
                color: #0C5933;

            }

            .separation {
                display: inline;
                color: #14A35B;
                white-space: pre-wrap;
                font-size: 300%;
                font-weight: bold;
            }

            body {
                background-color: #CDEDDD;
                color: #0C5933
            }
        </style>
        <title>Rango - {% block title_block %} How to Tango with Django! {% endblock %}</title>
    </head>
    <body>
        <div>
            <nav class="navbar">
                <div class="nav-left">
                    <a class="logo" href="{% url 'gamecritique:index' %}"><span class="logo-game">Game</span><span class="logo-crit">Crit</span><span class="logo-ique">ique</span></a>
                </div>
                <div class="nav-center">
                    <a class="navlink" href="{% url 'gamecritique:index' %}">Home</a>
                    <span class="separation">  |  </span>
                    <a class="navlink" href="{% url 'gamecritique:index' %}">Search</a>
                </div>
                <div class="nav-right">
                    {% if user.is_authenticated %}
                        <a class="navlink" href="{% url 'gamecritique:restricted' %}">Restricted Page</a>
                        <span class="separation">  |  </span>
                        <a class="navlink" href="{% url 'gamecritique:logout' %}">Logout</a>
                    {% else %}
                        <a class="navlink" href="{% url 'gamecritique:register' %}">Register</a>
                        <span class="separation">  |  </span>
                        <a class="navlink" href="{% url 'gamecritique:login' %}">Login</a>
                    {% endif %}    
                </div>
            </nav>
        </div>

        <div>
        {% block body_block %}
        {% endblock %}
        </div>
        
        <div>
            {% block sidebar_block %}
            {% endblock %}
        </div>

        <hr />
    </body>
</html>
